version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quantumguard-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantumguard}
      POSTGRES_USER: ${POSTGRES_USER:-quantum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantum_user} -d ${POSTGRES_DB:-quantumguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: quantumguard-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-quantum_redis_2025}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-quantum_redis_2025}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # Crypto Service (Python + FastAPI)
  crypto-service:
    build:
      context: ./crypto-service
      dockerfile: Dockerfile
    container_name: quantumguard-crypto
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://app.postcuantica.io}
      # CA key lives on this volume: back it up. Set to false once the CA exists so a
      # lost volume fails loudly instead of silently minting a new CA.
      - PKI_AUTO_INIT_CA=${PKI_AUTO_INIT_CA:-true}
      # Unlocks the encrypted CA keys; keep it only in .env and an offline backup.
      - PKI_KEY_PASSPHRASE=${PKI_KEY_PASSPHRASE:?PKI_KEY_PASSPHRASE is required}
      - PKI_PUBLIC_BASE_URL=${PKI_PUBLIC_BASE_URL:-https://app.postcuantica.io}
      - CRYPTO_SERVICE_TOKEN=${CRYPTO_SERVICE_TOKEN:?CRYPTO_SERVICE_TOKEN is required}
      - TLS_ENABLED=true
    volumes:
      - crypto_pki:/app/pki
      - crypto_tls_public:/app/tls-public
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantumguard-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quantum_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantumguard}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-quantum_redis_2025}@redis:6379
      - CRYPTO_SERVICE_URL=https://crypto-service:8001
      - CRYPTO_SERVICE_TOKEN=${CRYPTO_SERVICE_TOKEN:?CRYPTO_SERVICE_TOKEN is required}
      - CRYPTO_TLS_CA_FILE=/app/crypto-tls/server.crt
      - PKI_PUBLIC_BASE_URL=${PKI_PUBLIC_BASE_URL:-https://app.postcuantica.io}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - STORAGE_PATH=/app/uploads
      # Firma simple: signer invites and OTP codes. Without a key, creating
      # an envelope fails with a clear 503 instead of silently not sending.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-QuantumGuard <firmas@postcuantica.io>}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://app.postcuantica.io}
      # Billing (Basic/Pro plans). Without a key, checkout/portal fail with a
      # clear 503 and the webhook rejects with 503 instead of silently no-op'ing.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_BASIC=${STRIPE_PRICE_BASIC:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
    volumes:
      - backend_uploads:/app/uploads
      - crypto_tls_public:/app/crypto-tls:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crypto-service:
        condition: service_healthy
    networks:
      - internal
      - egress

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantumguard-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - external

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  crypto_pki:
    driver: local
  crypto_tls_public:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
  # Outbound-only egress for backend calls to Resend/Stripe. Separate from
  # `external` so the backend never joins the tunnel-facing shared network.
  egress:
    driver: bridge
  external:
    driver: bridge
